services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      VISIONINSPECT_TOKEN_SECRET: ${VISIONINSPECT_TOKEN_SECRET:-replace-this-secret-in-production}
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
