# Production stack: backend + frontend behind Nginx.
# Run from the project root: docker compose -f deploy/docker-compose.prod.yml up -d
version: "3.9"
services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./visioninspect.db}
      - JWT_SECRET=${JWT_SECRET:?set a strong JWT_SECRET in your environment}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://your-domain.example}
    volumes: ["backend_data:/app"]
  frontend:
    build: ../frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-https://your-domain.example/api}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
volumes:
  backend_data:
